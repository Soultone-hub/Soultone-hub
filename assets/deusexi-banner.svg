  <style>
    .eye-lid, .eye-aperture {
      transform-box: fill-box;
      transform-origin: center;
      animation: deusexi-blink 5.6s ease-in-out infinite;
    }
    @keyframes deusexi-blink {
      0%, 18%, 24%, 27%, 33%, 100% { transform: scaleY(1); }
      20%, 21%, 29%, 30% { transform: scaleY(.04); }
    }
    .eye-closed-line {
      opacity: 0;
      animation: deusexi-closed-line 5.6s ease-in-out infinite;
    }
    @keyframes deusexi-closed-line {
      0%, 18%, 24%, 27%, 33%, 100% { opacity: 0; }
      20%, 21%, 29%, 30% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye-lid, .eye-aperture, .eye-closed-line { animation: none; }
    }
  </style>
